services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/outputs:/app/outputs
      - ./backend/thumbnails:/app/thumbnails

  frontend:
    build: ./frontend
    ports:
      - "4173:4173"
    depends_on:
      - backend