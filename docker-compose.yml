services:
  backend:
    build: ./server
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    volumes:
      - ./server/uploads:/app/uploads
      - ./server/outputs:/app/outputs
      - ./server/thumbnails:/app/thumbnails

  frontend:
    build: ./merger
    ports:
      - "4173:4173"
    depends_on:
      - backend